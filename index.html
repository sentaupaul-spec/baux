<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baux">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f3ee">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Baux</title>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/jspdf.umd.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<header class="haut">
  <div class="haut-int">
    <div class="marque"><b>Faire un bail</b>SCI CBI — Annie Cresp</div>
  </div>
</header>

<main>
  <div id="chargement" class="carte"><p class="grand">Préparation du modèle…</p></div>

  <div class="carte" id="etape-1" hidden>
    <h2 class="etape"><span class="num">1</span>Choisir l'appartement</h2>
    <div class="choix" id="choix-appart"></div>
  </div>

  <div id="formulaire" hidden>
    <div class="carte">
      <h2 class="etape"><span class="num">2</span>Le locataire</h2>
      <div class="grille2">
        <div class="champ"><label for="c-prenom">Prénom</label><input id="c-prenom" type="text" autocomplete="off" autocapitalize="words"></div>
        <div class="champ"><label for="c-nom">Nom</label><input id="c-nom" type="text" autocomplete="off" autocapitalize="words"></div>
      </div>
      <div class="grille2">
        <div class="champ"><label for="c-naissance">Date de naissance (ex. 12/03/2001)</label><input id="c-naissance" type="text" inputmode="numeric" autocomplete="off" maxlength="10"></div>
        <div class="champ"><label for="c-lieu">Lieu de naissance</label><input id="c-lieu" type="text" autocomplete="off" autocapitalize="words"></div>
      </div>
      <div class="grille2">
        <div class="champ"><label for="c-tel">Téléphone</label><input id="c-tel" type="tel" inputmode="tel" autocomplete="off"></div>
        <div class="champ"><label for="c-email">E-mail</label><input id="c-email" type="email" autocomplete="off" autocapitalize="none" inputmode="email"></div>
      </div>
      <p class="question">Y a-t-il un garant ?</p>
      <div class="deux-choix" id="garant">
        <button type="button" class="choix-simple choisi" id="garant-non" aria-pressed="true">Non</button>
        <button type="button" class="choix-simple" id="garant-oui" aria-pressed="false">Oui</button>
      </div>
      <div id="bloc-garant" hidden>
        <div class="champ"><label for="c-garant-nom">Prénom et nom du garant</label><input id="c-garant-nom" type="text" autocomplete="off" autocapitalize="words"></div>
        <div class="champ"><label for="c-garant-adresse">Adresse du garant (numéro et rue)</label><input id="c-garant-adresse" type="text" autocomplete="off"></div>
        <div class="grille2">
          <div class="champ"><label for="c-garant-cp">Code postal</label><input id="c-garant-cp" type="text" inputmode="numeric" autocomplete="off" maxlength="10"></div>
          <div class="champ"><label for="c-garant-ville">Ville</label><input id="c-garant-ville" type="text" autocomplete="off" autocapitalize="words"></div>
        </div>
      </div>
    </div>

    <div class="carte">
      <h2 class="etape"><span class="num">3</span>La location</h2>
      <div class="champ"><label for="c-effet">Date d'entrée</label><input id="c-effet" type="date"></div>
      <p class="question">Durée du bail</p>
      <div class="deux-choix" id="duree">
        <button type="button" class="choix-simple choisi" data-duree="1 an" aria-pressed="true">1 an</button>
        <button type="button" class="choix-simple" data-duree="9 mois (location consentie à un étudiant)" aria-pressed="false">9 mois (étudiant)</button>
      </div>
      <div class="grille2">
        <div class="champ"><label for="c-loyer">Loyer (€)</label><input id="c-loyer" type="text" inputmode="decimal" autocomplete="off"></div>
        <div class="champ"><label for="c-charges">Charges (€)</label><input id="c-charges" type="text" inputmode="decimal" autocomplete="off"></div>
      </div>
      <div class="total"><span>Total par mois</span><span id="c-total">—</span></div>
      <div class="grille2">
        <div class="champ"><label for="c-cave">Numéro de cave (si vous l'avez)</label><input id="c-cave" type="text" autocomplete="off"></div>
        <div class="champ"><label for="c-signature">Date de signature</label><input id="c-signature" type="date"></div>
      </div>
    </div>

    <div class="carte">
      <h2 class="etape"><span class="num">4</span>Relire et enregistrer</h2>
      <p class="resume" id="resume"></p>
      <button type="button" class="btn btn-principal" id="btn-apercu">Voir l'aperçu du bail</button>
      <div class="message" id="message" role="status" aria-live="polite"></div>
    </div>
  </div>

  <p class="version" id="version"></p>
</main>

<div id="apercu" role="dialog" aria-modal="true" aria-labelledby="apercu-titre" hidden>
  <div class="apercu-haut">
    <h2 id="apercu-titre" tabindex="-1">Aperçu du bail</h2>
    <p>Relisez les 9 pages. Si tout est bon, touchez « Enregistrer le bail ».</p>
  </div>
  <div class="apercu-pages" id="apercu-pages"></div>
  <div class="apercu-bas">
    <div class="message" id="message-apercu" role="status" aria-live="polite"></div>
    <div class="apercu-boutons">
      <button type="button" class="btn btn-secondaire" id="btn-retour">← Retour</button>
      <button type="button" class="btn btn-principal" id="btn-enregistrer">Enregistrer le bail</button>
      <button type="button" class="btn btn-principal" id="btn-nouveau" hidden>Faire un nouveau bail</button>
    </div>
  </div>
</div>

</body>
</html>
